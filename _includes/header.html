<header class="site-header" role="banner">
  <div class="hero" style="background-image: linear-gradient(180deg, rgba(10, 24, 40, 0.42) 0%, rgba(10, 24, 40, 0.78) 100%), url('{{ site.header_image | relative_url }}');">
    <div class="wrapper hero-inner">
      <nav class="site-nav" aria-label="Navigation principale">
        <a class="nav-home" href="{{ "/" | relative_url }}">Accueil</a>
        <a href="{{ "/about/" | relative_url }}">À propos</a>
        <a href="{{ "/themes/" | relative_url }}">Thèmes</a>
        <a href="{{ "/notes/" | relative_url }}">Notes</a>
      </nav>
      <p class="hero-kicker">Journal d'apprentissage</p>
      <h1 class="hero-title">
        <a href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
      </h1>
      <p class="hero-tagline">{{ site.description | escape }}</p>
    </div>
  </div>
</header>
